name: kickbase-helper

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: kickbase-helper-app:latest
  restart: unless-stopped
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  env_file: .env
  environment:
    # POSTGRES_PASSWORD must be URL-safe (hex), it is embedded in the URL as is.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?fehlt in .env}:${POSTGRES_PASSWORD:?fehlt in .env}@db:5432/${POSTGRES_DB:?fehlt in .env}
  secrets:
    - kickbase_email
    - kickbase_password
    - llm_api_key
  logging: *logging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?fehlt in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?fehlt in .env}
      POSTGRES_DB: ${POSTGRES_DB:?fehlt in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    <<: *app
    command: ["web"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *app
    command: ["worker"]
    secrets:
      - kickbase_email
      - kickbase_password
      - telegram_bot_token
      - llm_api_key
      - claude_bridge_token
    # Optional Claude bridge (experimental): host access and the MCP port live in
    # compose.claude.yaml, so a default installation publishes no worker port.
    depends_on:
      app:
        condition: service_healthy

secrets:
  kickbase_email:
    file: ${KICKBASE_EMAIL_FILE:-./secrets/kickbase_email}
  kickbase_password:
    file: ${KICKBASE_PASSWORD_FILE:-./secrets/kickbase_password}
  # Telegram bot token (notifications), gitignored file next to this compose file.
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  # API key of the language model (Mistral), gitignored; without it the worker runs without AI.
  llm_api_key:
    file: ./secrets/llm_api_key
  # Shared token of the Claude bridge on the host (deploy/claude-bridge/), gitignored; an empty
  # file switches Claude im Chat off.
  claude_bridge_token:
    file: ./secrets/claude_bridge_token

volumes:
  pgdata:
