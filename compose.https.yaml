# Standard Caddy: works with any DNS provider. ACME needs reachable HTTP/HTTPS ports.
services:
  app:
    environment:
      SESSION_HTTPS_ONLY: "true"
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${PROXY_BIND_ADDRESS:-}${PROXY_BIND_ADDRESS:+:}${PROXY_HTTP_PORT:-80}:80/tcp"
      - "${PROXY_BIND_ADDRESS:-}${PROXY_BIND_ADDRESS:+:}${PROXY_HTTPS_PORT:-443}:443/tcp"
      - "${PROXY_BIND_ADDRESS:-}${PROXY_BIND_ADDRESS:+:}${PROXY_HTTPS_PORT:-443}:443/udp"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?fehlt in .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
