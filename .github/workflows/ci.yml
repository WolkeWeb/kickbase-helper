name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  checks:
    name: Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .

      - name: Veröffentlichungsstand (keine privaten Artefakte)
        run: uv run python scripts/check_public_tree.py

      - name: Secret-Scan (gitleaks, ganzer Verlauf)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tgz
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --no-banner --redact --exit-code 1

      - name: Workflows (actionlint + zizmor)
        run: |
          uvx --from actionlint-py==1.7.12.25 actionlint -color
          uvx zizmor@1.30.1 --offline --min-severity medium .github/

      - name: Shell-Skripte (shellcheck)
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - name: Frontend-JS (Syntax)
        run: git ls-files -z 'app/web/static/js/*.js' | xargs -0 -r -n1 node --check

      # One xdist worker per CPU; every worker gets its own database (tests/conftest.py).
      # Coverage costs about a third more runtime, so it is only measured on main.
      - name: pytest
        if: github.event_name == 'pull_request'
        run: uv run pytest -q -n auto
      - name: pytest (mit Coverage)
        if: github.event_name != 'pull_request'
        run: uv run pytest -q -n auto --cov --cov-report=
      - name: Coverage in die Zusammenfassung
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -f .coverage ] || exit 0
          {
            echo "### Testabdeckung: $(uv run coverage report --format=total) %"
            echo
            echo "<details><summary>Pro Datei</summary>"
            echo
            uv run coverage report --format=markdown --skip-covered --sort=cover
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: App-Image (Build + Smoke-Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          tags: kickbase-helper-app:ci
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      # Exercise the documented first-install path, every Compose mode and local HTTP login.
      # The isolated smoke stack starts db/app only; no worker and no Kickbase API requests.
      - name: Erstinstallation (Compose-Varianten + Migrationen + Login)
        run: uv run --no-dev python scripts/check_deployment.py --smoke-image kickbase-helper-app:ci
